<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <style>
      html, body {
        margin: 0; padding: 0; background: transparent; overflow: hidden;
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff;
      }
      .group {
        display: inline-flex; align-items: stretch; box-sizing: border-box; height: 30px;
        border: 1px solid rgba(255,255,255,.75); border-radius: 8px; overflow: hidden;
      }
      button {
        appearance: none; border: 0; margin: 0; padding: 0; background: transparent; color: #fff;
        width: 36px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
        line-height: 0;
      }
      button + button { border-left: 1px solid rgba(255,255,255,.35); }
      button:hover { background: rgba(255,255,255,.16); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
      button:disabled { opacity: .5; cursor: progress; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <div class="group" role="group" aria-label="Reply or forward">
      <button type="button" data-mode="reply" aria-label="Reply">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5 3.5 9.5 8 14"/><path d="M4 9.5h7a5 5 0 0 1 5 5V16"/></svg>
      </button>
      <button type="button" data-mode="replyAll" aria-label="Reply all">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 5 2 9.5 6.5 14"/><path d="M10.5 5 6 9.5l4.5 4.5"/><path d="M6.5 9.5H12a5 5 0 0 1 5 5V16"/></svg>
      </button>
      <button type="button" data-mode="forward" aria-label="Forward">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5 4.5 4.5L12 14"/><path d="M16 9.5H9a5 5 0 0 0-5 5V16"/></svg>
      </button>
    </div>
    <script src="compose.js"></script>
  </body>
</html>
